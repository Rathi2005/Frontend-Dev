<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 80%;
            display: flex;
            width: 700px;
        }
        img{

                content: url('../image/panda.jpg');
            }
        }
    </style>

        <img src="../image/ironman.jpg" alt="">
    </div>
</body>
</html>
