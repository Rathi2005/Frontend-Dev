<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fluid Grid Example</title>
    <style>
      * {
        box-sizing: border-box;
      }

      .container {
        display: flex;
        justify-content: center;
        gap: 15px; 
        padding: 20px;
      }
      
      .box {
        background-color: #46b6a5; 
        padding: 40px;
        flex: 1;
        text-align: center; 
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <h2>Fluid Grid Layout</h2>
    <div class="container">
      <div class="box">Box 1</div>
      <div class="box">Box 2</div>
      <div class="box">Box 3</div>
    </div>
  </body>
</html>
