<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Typography</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: clamp(1.5rem, 4vw, 3rem);
      margin-bottom: 1rem;
    }

    p {
      font-size: clamp(1rem, 2.5vw, 1.5rem); 
      line-height: 1.6;
      max-width: 600px;
    }
  </style>
</head>
<body>
  <h1>Responsive Typography Example</h1>
  <p>
    This heading and paragraph automatically adjust their font sizes based on the screen width using the <code>clamp()</code> function.
  </p>
</body>
</html>
