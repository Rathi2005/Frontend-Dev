<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Card Layout</title>
    <link rel="stylesheet" href="cards.css" />
  </head>
  <body>
    <header>
      <h1>Responsive Product Cards</h1>
    </header>
    <main class="card-container">
      <!-- Card 1 -->
      <section class="card">
        <img
          src="https://picsum.photos/id/1015/500/300"
          alt="Wireless Headphones"
        />
        <h2>Wireless Headphones</h2>
        <p>Crystal-clear sound and noise cancellation.</p>
        <button>Add to Cart</button>
      </section>

      <!-- Card 2 -->
      <section class="card">
        <img
          src="https://picsum.photos/id/1062/500/300"
          alt="Smartwatch"
        />
        <h2>Smartwatch</h2>
        <p>Track fitness, heart rate, and notifications easily.</p>
        <button>Add to Cart</button>
      </section>

      <!-- Card 3 -->
      <section class="card">
        <img
          src="https://picsum.photos/id/1080/500/300"
          alt="Camera"
        />
        <h2>Digital Camera</h2>
        <p>Capture memories in stunning high resolution.</p>
        <button>Add to Cart</button>
      </section>

      <!-- Card 4 -->
      <section class="card">
        <img
          src="https://picsum.photos/id/1044/500/300"
          alt="Gaming Keyboard"
        />
        <h2>Gaming Keyboard</h2>
        <p>RGB backlight with mechanical precision keys.</p>
        <button>Add to Cart</button>
      </section>
    </main>
  </body>
</html>
