<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>18 - Quotations</title>
</head>
<body>
  <h1>Quotations</h1>

  <blockquote>
    "The only limit to our realization of tomorrow is our doubts of today."
    — This is an example of a long quote using &lt;blockquote&gt;.
  </blockquote>

  <p>
    Here is a short quote inside a paragraph: <q>Learning never exhausts the mind</q>.
    Also note the use of an entity: &amp; which displays an ampersand.
  </p>
</body>
</html>
