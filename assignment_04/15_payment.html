<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>15 - Payment Form</title>
</head>
<body>
  <h1>Payment</h1>

  <form action="#" method="post">
    <label>
      Cardholder Name:<br>
      <input type="text" name="cardname" required>
    </label>
    <br><br>

    <label>
      Card Number:<br>
      <input type="text" name="cardnumber" maxlength="19" required>
    </label>
    <br><br>

    <label>
      Expiry Date (MM/YY):<br>
      <input type="text" name="expiry" placeholder="MM/YY" required>
    </label>
    <br><br>

    <label>
      CVV:<br>
      <input type="password" name="cvv" maxlength="4" required>
    </label>
    <br><br>

    <button type="submit">Pay Now</button>
  </form>
</body>
</html>
