<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>9 - File Upload (.jpg, .png only)</title>
</head>
<body>
  <h1>Upload an Image</h1>

  <form action="#" method="post" enctype="multipart/form-data">
    <label>
      Choose an image to upload (JPG or PNG only):<br>
      <input type="file" name="image" accept=".jpg, .jpeg, .png" required>
    </label>
    <br><br>

    <p>Allowed file types: .jpg, .jpeg, .png. Maximum file size should be enforced on server-side.</p>

    <button type="submit">Upload</button>
  </form>
</body>
</html>
