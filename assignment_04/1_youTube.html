<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>1 - YouTube Embed (Percentage Size)</title>
  <!--
    Set width and height using only percentage values so iframe scales with browser size.
  -->
</head>
<body>
  <h1>YouTube Video (Responsive using % width & height)</h1>

  <!-- Example YouTube embed.
       Replace src value with your desired YouTube video URL (the embed URL).
       width and height are percentage values only. -->
  <iframe
    src="https://www.youtube.com/embed/dQw4w9WgXcQ"
    width="80%"
    height="45%"
    title="YouTube video player"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>
  </iframe>

</body>
</html>
