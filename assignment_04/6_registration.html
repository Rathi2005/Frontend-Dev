<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>6 - User Registration Form</title>
  <!-- Only HTML allowed; no CSS or JS -->
</head>
<body>
  <h1>User Registration</h1>

  <form action="#" method="post">
    <label>
      Full Name:<br>
      <input type="text" name="fullname" required>
    </label>
    <br><br>

    <label>
      Email Address:<br>
      <input type="email" name="email" required>
    </label>
    <br><br>

    <label>
      Password:<br>
      <input type="password" name="password" required>
    </label>
    <br><br>

    <label>
      Confirm Password:<br>
      <input type="password" name="confirm_password" required>
    </label>
    <br><br>

    <button type="submit">Register</button>
  </form>
</body>
</html>
