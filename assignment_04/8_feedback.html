<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>8 - Feedback Form</title>
</head>
<body>
  <h1>Feedback</h1>

  <form method="post" action="#">
    <label>
      Your Feedback:<br>
      <textarea name="feedback" rows="6" cols="60" required></textarea>
    </label>
    <br><br>

    Rating:<br>
    <label><input type="radio" name="rating" value="good" required> Good</label><br>
    <label><input type="radio" name="rating" value="average" required> Average</label><br>
    <label><input type="radio" name="rating" value="poor" required> Poor</label>
    <br><br>

    <button type="submit">Submit Feedback</button>
  </form>
</body>
</html>
