<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>20 - Important Head Elements</title>

  <!-- meta description: brief summary for search engines -->
  <meta name="description" content="Example page showing important head elements.">

  <!-- meta author: who created the page -->
  <meta name="author" content="Your Name">

  <!-- base: sets the base URL for all relative links on the page -->
  <base href="https://example.com/">

  <!-- link: example favicon (replace with a real favicon file if available) -->
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <!-- style: internal CSS can go here; left empty as requested (only HTML allowed in assignment) -->
  <style>
    /* Empty style element included as requested */
  </style>

  <!-- script: place for JavaScript (empty in this assignment) -->
  <script>
    // Empty script element included as requested
  </script>

  <!--
    Comments:
    - <title>: Sets the title shown in the browser tab.
    - <meta charset>: Declares document character encoding.
    - <meta name="description">: Short summary of the page.
    - <meta name="author">: Page author.
    - <base>: Base URL used to resolve relative URLs.
    - <link>: Reference to external resources like favicons or stylesheets.
    - <style>: Internal CSS rules (empty here).
    - <script>: JavaScript (empty here).
  -->
</head>
<body>
  <h1>Head Elements Example</h1>
  <p>This page contains the most important head elements with comments explaining each one.</p>
</body>
</html>
