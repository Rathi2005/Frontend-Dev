<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>3 - Two Iframes (Intro & Hobby)</title>
  <!--
    Both iframes are shown one below the other.
    Use balanced width/height attributes so they appear proportionate.
  -->
</head>
<body>
  <h1>Introduction and Hobby Pages</h1>

  <!-- First iframe: introduction page (replace src with your actual introduction page if available) -->
  <iframe
    srcdoc="<h2>Introduction</h2><p>Hello — I'm [Your Name]. This is my introduction page.</p>"
    title="Introduction"
    width="90%"
    height="250"
    frameborder="0">
  </iframe>

  <br><br>

  <!-- Second iframe: favorite hobby page (replace srcdoc or src as needed) -->
  <iframe
    srcdoc="<h2>My Hobby</h2><p>My favorite hobby is photography and cycling.</p>"
    title="Hobby"
    width="90%"
    height="250"
    frameborder="0">
  </iframe>

</body>
</html>
