<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pricing</title>
  <link rel="stylesheet" href="5_pricing.css">
</head>
<body>
  <section class="pricing-section">
    <div class="card basic">
      <h2>Basic</h2>
      <p class="price">$9 / mo</p>
      <ul>
        <li>Feature A</li>
        <li>Feature B</li>
      </ul>
      <button>Choose</button>
    </div>

    <div class="card featured">
      <h2>Pro</h2>
      <p class="price">$29 / mo</p>
      <ul>
        <li>Feature A</li>
        <li>Feature B</li>
        <li>Feature C</li>
      </ul>
      <button>Choose</button>
    </div>

    <div class="card premium">
      <h2>Premium</h2>
      <p class="price">$59 / mo</p>
      <ul>
        <li>Everything</li>
        <li>Priority support</li>
      </ul>
      <button>Choose</button>
    </div>
  </section>
</body>
</html>
