<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Flip Card</title>
  <link rel="stylesheet" href="9_flipcard.css">
</head>
<body>
  <div class="flip-wrapper">
    <div class="card">
      <div class="face front">
        <img src="https://via.placeholder.com/300x180?text=Front+Image" alt="Front">

        <h3>Details</h3>
        <p>This is the back of the card with description text.</p>
      </div>
    </div>
  </div>
</body>
</html>
