<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Combo Layout</title>
  <link rel="stylesheet" href="10_combo.css">
</head>
<body>
  <header class="site-header">
    <div class="logo">Logo</div>
    <nav class="nav">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Blog</a>
    </nav>
  </header>

  <main class="container">
    <article class="article">
      <h1 class="animated-title">Article Title</h1>

      <div class="features">
        <div class="feature">Box 1</div>
        <div class="feature">Box 2</div>
        <div class="feature">Box 3</div>
      </div>

      <p>Article content goes here. This layout uses a grid for main content and flex for inner boxes.</p>
    </article>

    <aside class="sidebar">
      <h3>Sidebar</h3>
      <p>Links and widgets</p>
    </aside>
  </main>

  <footer class="site-footer">
    <p>© 2025 Example. All rights reserved.</p>
  </footer>
</body>
</html>
