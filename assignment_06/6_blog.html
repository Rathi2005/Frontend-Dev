<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Blog Layout</title>
  <link rel="stylesheet" href="6_blog.css">
</head>
<body>
  <div class="site">
    <header class="site-header">
      <h1>My Blog</h1>
      <nav>
        <a href="#">Home</a> | <a href="#">About</a> | <a href="#">Contact</a>
      </nav>
    </header>

    <div class="grid">
      <aside class="sidebar">
        <h3>Categories</h3>
        <ul>
          <li>Tech</li>
          <li>Design</li>
          <li>Tutorials</li>
        </ul>
      </aside>

      <main class="posts">
        <article class="post">
          <h2>Post One</h2>
          <p>Short excerpt of the first post...</p>
        </article>

        <article class="post">
          <h2>Post Two</h2>
          <p>Short excerpt of the second post...</p>
        </article>
      </main>
    </div>

    <footer class="site-footer">
      <p>Contact: email@example.com</p>
    </footer>
  </div>
</body>
</html>
