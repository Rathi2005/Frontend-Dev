<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="photo-gallery.css">
</head>
<body>
  <header>
    <h1>Nature Photography Gallery</h1>
  </header>

  <main class="gallery">
    <div class="gallery-item">
      <img src="https://picsum.photos/id/1015/600/400" alt="Mountain">
      <div class="caption">Majestic Mountains</div>
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/id/1025/600/400" alt="Bird">
      <div class="caption">Freedom in Flight</div>
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/id/1035/600/400" alt="Forest">
      <div class="caption">Mystic Forest</div>
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/id/1045/600/400" alt="Lake">
      <div class="caption">Peaceful Lake</div>
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/id/1055/600/400" alt="Desert">
      <div class="caption">Golden Desert</div>
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/id/1065/600/400" alt="Waterfall">
      <div class="caption">Flowing Waterfall</div>
    </div>
  </main>
</body>
</html>
