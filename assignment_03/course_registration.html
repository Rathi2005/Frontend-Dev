<!DOCTYPE html>
<html>
<head>
  <title>Course Registration Form</title>
  <!-- Form structure using only HTML (no actual form submission required) -->
</head>
<body>
  <header>
    <h1>Course Registration</h1>
  </header>

  <main>
    <form>
      <fieldset>
        <legend>Student Details</legend>
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" placeholder="Your name"><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="you@example.com"><br><br>
      </fieldset>

      <fieldset>
        <legend>Course Selection</legend>
        <label for="course">Select Course:</label><br>
        <select id="course" name="course">
          <option value="ml">Machine Learning</option>
          <option value="web" selected>Web Development (Selected)</option>
          <option value="ds">Data Science</option>
        </select><br><br>
      </fieldset>
    </form>

    <h2>Available Course Schedules</h2>
    <table border="1" title="Course schedules">
      <thead>
        <tr>
          <th>Day</th>
          <th>Time</th>
          <th>Instructor</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Monday</td>
          <td>4:00 PM - 6:00 PM</td>
          <td>Dr. Sharma</td>
        </tr>
        <tr>
          <td>Wednesday</td>
          <td>6:00 PM - 8:00 PM</td>
          <td>Ms. Verma</td>
        </tr>
      </tbody>
    </table>
  </main>

  <footer>
    <p>© 2025 Training Center</p>
  </footer>
</body>
</html>
