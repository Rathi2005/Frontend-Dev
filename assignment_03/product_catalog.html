<!DOCTYPE html>
<html>
<head>
  <title>Product Catalog - Sample Store</title>
  <!-- Product catalog using a table and images -->
</head>
<body>
  <header>
    <h1>Sample Online Store - Product Catalog</h1>
  </header>

  <main>
    <table border="1" title="Product Catalog" cellpadding="6" cellspacing="0">
      <caption><strong>Products</strong></caption>
      <thead>
        <tr>
          <th>Product Name</th>
          <th>Description</th>
          <th>Image</th>
          <th>Price</th>
          <th>Availability</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Wireless Headphones</td>
          <td>Over-ear, noise-cancelling</td>
          <td rowspan="2"><img src="https://upload.wikimedia.org/wikipedia/commons/4/45/Headphones.jpg" alt="Wireless Headphones" width="120"></td>
          <td>$49.99</td>
          <td>In Stock</td>
        </tr>
        <tr>
          <td>Bluetooth Speaker</td>
          <td>Portable, 10W output</td>
          <td>$29.99</td>
          <td>Out of stock</td>
        </tr>
        <tr>
          <td colspan="2">Bundle: Headphones + Speaker</td>
          <td><img src="https://upload.wikimedia.org/wikipedia/commons/3/3f/Portable_speaker.jpg" alt="Bundle Image" width="120"></td>
          <td colspan="2">$74.99 (Limited)</td>
        </tr>
      </tbody>
    </table>
  </main>

  <footer>
    <p>© 2025 Sample Online Store</p>
  </footer>
</body>
</html>
