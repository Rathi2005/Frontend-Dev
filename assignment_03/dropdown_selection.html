<!DOCTYPE html>
<html>
<head>
  <title>Dropdown Selection Page</title>
  <!-- Multiple select dropdowns with pre-selected options -->
</head>
<body>
  <h1>Choose Your Location & Favorite Place</h1>

  <form>
    <label for="country">Country:</label><br>
    <select id="country" name="country">
      <option value="india" selected>India</option>
      <option value="france">France</option>
      <option value="japan">Japan</option>
    </select><br><br>

    <label for="state">State:</label><br>
    <select id="state" name="state">
      <option value="up" selected>Uttar Pradesh</option>
      <option value="maharashtra">Maharashtra</option>
      <option value="karnataka">Karnataka</option>
    </select><br><br>

    <label for="city">City:</label><br>
    <select id="city" name="city">
      <option value="mathura" selected>Mathura</option>
      <option value="mumbai">Mumbai</option>
      <option value="bangalore">Bengaluru</option>
    </select><br><br>

    <label for="place">Favorite Tourist Place:</label><br>
    <select id="place" name="place">
      <option value="taj" selected>Taj Mahal</option>
      <option value="eiffel">Eiffel Tower</option>
      <option value="fushimi">Fushimi Inari</option>
    </select>
  </form>

  <p>Selected: Country — <strong>India</strong>, State — <strong>Uttar Pradesh</strong>, City — <strong>Mathura</strong>, Favorite Place — <strong>Taj Mahal</strong>.</p>
</body>
</html>
