<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Q3 - Multi-step Form</title>
  <style>
    body{font-family:Arial;padding:20px;}
    .step { display:none; }
    .step.active { display:block; }
    .error { color: red; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h2>Multi-Step Form</h2>

  <form id="multiForm" novalidate>
    <div class="step active" data-step="1">
      <label>Name: <input type="text" id="nameInput"></label>
      <div id="nameError" class="error"></div>
      <div><button type="button" id="next1">Next</button></div>
    </div>

    <div class="step" data-step="2">
      <label>Email: <input type="email" id="emailInput"></label>
      <div id="emailError" class="error"></div>
      <div>
        <button type="button" id="back2">Back</button>
        <button type="button" id="next2">Next</button>
      </div>
    </div>

    <div class="step" data-step="3">
      <label>Password: <input type="password" id="passwordInput"></label>
      <div id="passwordError" class="error"></div>
      <div>
        <button type="button" id="back3">Back</button>
        <button type="button" id="finishBtn">Finish</button>
      </div>
    </div>
  </form>

  <div id="summary" style="margin-top:20px;"></div>

  <script src="q3.js"></script>
</body>
</html>
