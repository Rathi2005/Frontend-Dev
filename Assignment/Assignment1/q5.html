<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Q5 - Image Gallery</title>
  <style>
    body{font-family:Arial;padding:20px;}
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; max-width:720px; }
    .grid img { width:100%; cursor:pointer; display:block; }
    .modal-overlay {
      position:fixed; inset:0; display:none; align-items:center; justify-content:center;
      background: rgba(0,0,0,0.6);
    }
    .modal { background:#fff; padding:10px; border-radius:6px; max-width:90%; max-height:90%; }
    .modal img { max-width:100%; height:auto; display:block; }
  </style>
</head>
<body>
  <h2>Image Gallery</h2>
  <div class="grid" id="imageGrid">
    <!-- 6 images -->
    <img src="https://picsum.photos/id/1015/300/200" alt="img1" />
    <img src="https://picsum.photos/id/1025/300/200" alt="img2" />
    <img src="https://picsum.photos/id/1035/300/200" alt="img3" />
    <img src="https://picsum.photos/id/1045/300/200" alt="img4" />
    <img src="https://picsum.photos/id/1055/300/200" alt="img5" />
    <img src="https://picsum.photos/id/1065/300/200" alt="img6" />
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalBox">
      <img id="modalImage" src="" alt="preview" />
    </div>
  </div>

  <script src="q5.js"></script>
</body>
</html>
