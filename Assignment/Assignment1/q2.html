<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Q2 - Character Counter</title>
  <style>
    body{font-family:Arial;padding:20px;}
    #counter{padding:6px; display:inline-block; margin-left:10px;}
    .warning { background: yellow; }
    .danger { background: tomato; color: white; }
    textarea { width:100%; height:100px; }
  </style>
</head>
<body>
  <h2>Live Character Counter</h2>
  <textarea id="messageBox" maxlength="100" placeholder="Type up to 100 characters..."></textarea>
  <div>
    Remaining: <span id="remaining">100</span>
    <button id="resetBtn" type="button">Reset</button>
  </div>

  <script src="q2.js"></script>
</body>
</html>
