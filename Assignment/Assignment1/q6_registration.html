<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Q6 Registration</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    body{font-family:Arial;padding:20px}
    label{display:block;margin-top:8px}
    .msg{margin-top:10px}
    .error{color:red}
    .success{color:green}
  </style>
</head>
<body>
  <h2>User Registration</h2>
  <form id="reg">
    <label>Name: <input name="name" required></label>
    <label>Email: <input name="email" type="email" required></label>
    <button type="submit">Register</button>
  </form>
  <div id="msg" class="msg"></div>

<script>
  const api = 'http://localhost:3006/users';
  const form = document.getElementById('reg');
  const msg = document.getElementById('msg');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    msg.textContent = 'Checking...';
    const formData = new FormData(form);
    const name = formData.get('name').trim();
    const email = formData.get('email').trim();

    // First check if email exists
    axios.get(`${api}?email=${encodeURIComponent(email)}`)
      .then(resp => {
        if (resp.data && resp.data.length > 0) {
          msg.textContent = 'Email already registered.';
          msg.className = 'msg error';
        } else {
          // not exists -> register
          axios.post(api, { name, email })
            .then(r => {
              msg.textContent = 'Registration successful!';
              msg.className = 'msg success';
              form.reset();
            })
            .catch(err => {
              msg.textContent = 'Registration failed.';
              msg.className = 'msg error';
            });
        }
      })
      .catch(err => {
        msg.textContent = 'Error checking email.';
        msg.className = 'msg error';
      });
  });
</script>
</body>
</html>
