<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Q3 Task Manager</title>
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <style>
    body{font-family:Arial;padding:20px}
    .task{padding:8px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:10px}
    .priority{font-size:12px;color:#666}
  </style>
</head>
<body>
  <h2>Task Manager</h2>
  <label>Sort/Filter:
    <select id="filter">
      <option value="">-- All --</option>
      <option value="priority=Low">Low Priority</option>
      <option value="priority=Medium">Medium Priority</option>
      <option value="priority=High">High Priority</option>
      <option value="completed=true">Completed</option>
    </select>
  </label>

  <div id="list"></div>

<script>
  const base = 'http://localhost:3003/tasks';

  function load(filter){
    let url = base;
    if (filter) url += '?' + filter;
    $.ajax({
      url,
      method: 'GET',
      success: function(data){
        render(data);
      },
      error: function(){ $('#list').html('<div>Error loading tasks</div>'); }
    });
  }

  function render(tasks){
    const html = tasks.map(t => `
      <div class="task" data-id="${t.id}">
        <input type="checkbox" ${t.completed ? 'checked' : ''} class="chk" />
        <div style="flex:1">
          <div><strong>${t.title}</strong></div>
          <div class="priority">${t.priority} ${t.completed ? '• Completed' : ''}</div>
        </div>
      </div>
    `).join('');
    $('#list').html(html);
  }

  // handlers
  $('#filter').on('change', function(){
    load(this.value);
  });

  // delegate checkbox change
  $('#list').on('change', '.chk', function(){
    const container = $(this).closest('.task');
    const id = container.data('id');
    const newCompleted = this.checked;
    // optimistic UI
    container.find('.priority').html(container.find('.priority').text().replace('• Completed','') + (newCompleted ? ' • Completed' : ''));

    $.ajax({
      url: `${base}/${id}`,
      method: 'PATCH',
      contentType: 'application/json',
      data: JSON.stringify({ completed: newCompleted }),
      success: function(){ /* success - already updated UI */ },
      error: function(){
        // revert
        $(this).prop('checked', !newCompleted);
        load($('#filter').val());
        alert('Failed to update task status.');
      }
    });
  });

  // initial load
  load('');
</script>
</body>
</html>
