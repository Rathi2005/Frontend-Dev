<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="q8.css">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">Choose Your Plan</h2>

    <div class="row g-4">

        <!-- Basic Plan -->
        <div class="col-md-4">
            <div class="card pricing-card p-3 text-center">
                <h3>Basic</h3>
                <h2>$9/mo</h2>
                <ul class="list-unstyled">
                    <li>✔ 5 Projects</li>
                    <li>✔ Email Support</li>
                    <li>✖ Analytics</li>
                </ul>
                <button class="btn btn-outline-primary">Buy Now</button>
            </div>
        </div>

        <!-- Pro Plan (Highlight) -->
        <div class="col-md-4">
            <div class="card pricing-card bg-primary text-white p-3 text-center shadow-lg">
                <h3>Pro</h3>
                <h2>$19/mo</h2>
                <ul class="list-unstyled">
                    <li>✔ 20 Projects</li>
                    <li>✔ Priority Support</li>
                    <li>✔ Analytics</li>
                </ul>
                <button class="btn btn-light">Buy Now</button>
            </div>
        </div>

        <!-- Premium Plan -->
        <div class="col-md-4">
            <div class="card pricing-card p-3 text-center">
                <h3>Premium</h3>
                <h2>$29/mo</h2>
                <ul class="list-unstyled">
                    <li>✔ Unlimited Projects</li>
                    <li>✔ Support 24/7</li>
                    <li>✔ Advanced Analytics</li>
                </ul>
                <button class="btn btn-outline-primary">Buy Now</button>
            </div>
        </div>

    </div>

</div>

</body>
</html>
