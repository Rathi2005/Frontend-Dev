<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pseudo Classes Demo</title>
  <link rel="stylesheet" href="pseudo-classes.css">
</head>
<body>
  <header><h2>Pseudo-Classes Demonstration</h2></header>

  <main class="examples">
    <section>
      <a href="#">Hover Link</a>
      <p>:hover changes background when mouse hovers.</p>
    </section>
    <section>
      <button>Focus Button</button>
      <p>:focus adds border glow when clicked.</p>
    </section>
    <section>
      <button>Active Button</button>
      <p>:active darkens when pressed.</p>
    </section>
    <section>
      <ul>
        <li>Item 1</li><li>Item 2</li><li>Item 3</li><li>Item 4</li>
      </ul>
      <p>:nth-child(odd) gives alternate color.</p>
    </section>
  </main>

  <footer>CSS Pseudo-Classes Example</footer>
</body>
</html>
