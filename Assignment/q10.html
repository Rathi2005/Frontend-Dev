<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Showcase</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body>

<div class="container mt-4">

    <h2 class="text-center mb-4">Explore Destinations</h2>

    <!-- Carousel -->
    <div id="travelCarousel" class="carousel slide mb-4" data-bs-ride="carousel">

        <div class="carousel-inner">
            <div class="carousel-item active" data-bs-interval="2000">
                <img src="https://picsum.photos/900/400?1" class="d-block w-100">
                <div class="carousel-caption bg-dark bg-opacity-50 p-2 rounded">
                    <h5>Paris</h5>
                </div>
            </div>

            <div class="carousel-item" data-bs-interval="3000">
                <img src="https://picsum.photos/900/400?2" class="d-block w-100">
                <div class="carousel-caption bg-dark bg-opacity-50 p-2 rounded">
                    <h5>Maldives</h5>
                </div>
            </div>

            <div class="carousel-item" data-bs-interval="2500">
                <img src="https://picsum.photos/900/400?3" class="d-block w-100">
                <div class="carousel-caption bg-dark bg-opacity-50 p-2 rounded">
                    <h5>Switzerland</h5>
                </div>
            </div>
        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#travelCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#travelCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>

    </div>

    <!-- Progress Bar -->
    <h5>Booking Completion</h5>
    <div class="progress mb-4">
        <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width: 70%">
            70%
        </div>
    </div>

</div>

<footer class="text-center p-3 bg-dark text-white">
    <p class="m-0">Contact us: travel@agency.com | +91 99999 00000</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
