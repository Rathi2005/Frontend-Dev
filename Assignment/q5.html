<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Themed Blog</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

    <!-- Bootstrap CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- Custom Bootstrap Theme -->
    <link rel="stylesheet" href="q5.css">
</head>

<body>

<header class="bg-primary text-white text-center p-4 mb-4">
    <h1 class="fw-bold">My Custom Blog</h1>
    <p>Thoughts, Stories & Ideas</p>
</header>

<main class="container">

    <div class="row g-4">

        <!-- Blog Card 1 -->
        <div class="col-md-6">
            <div class="card shadow-sm">
                <img src="https://picsum.photos/600/300" class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title text-primary fw-bold">First Blog Post</h5>
                    <p class="card-text">This is a beginner-friendly blog layout using Bootstrap and custom theme colors.</p>
                    <button class="btn btn-primary">Read More</button>
                </div>
            </div>
        </div>

        <!-- Blog Card 2 -->
        <div class="col-md-6">
            <div class="card shadow-sm">
                <img src="https://picsum.photos/601/300" class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title text-primary fw-bold">Second Blog Post</h5>
                    <p class="card-text">Customize Bootstrap using CSS variables to make your website look unique.</p>
                    <button class="btn btn-primary">Read More</button>
                </div>
            </div>
        </div>

    </div>

</main>

<footer class="text-center p-3 bg-dark text-white mt-4">
    <p class="m-0">© 2025 My Custom Blog</p>
</footer>

</body>
</html>
