<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Banners</title>
</head>
<body>

  <header>
    <h2>Special Offers</h2>
  </header>

  <section id="banners">
    <div class="banner">🔥 50% OFF SALE</div>
    <div class="banner">🎁 Buy 1 Get 1 Free</div>
    <div class="banner">🚚 Free Delivery Today</div>
    <div class="banner">💳 Extra 10% Off on Cards</div>
    <div class="banner">⭐ Member Only Offers</div>
  </section>

  <button id="hide">Hide</button>
  <button id="show">Show</button>
  <button id="slide">Slide Toggle</button>
  <button id="fade">Fade Toggle</button>

  <style>
    .banner { padding: 10px; background: lightpink; margin: 5px; }
  </style>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="banner.js"></script>
</body>
</html>
